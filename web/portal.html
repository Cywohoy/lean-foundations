<!doctype html>
<html lang="ko">
<head>

  <link rel="preload" href="foundations/-verso-data/NanumSquareNeo-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="foundations/-verso-data/NanumSquareNeo-Bold.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    @font-face { font-family: Pretendard; src: url('foundations/-verso-data/PretendardVariable.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: NanumSquareNeo; src: url('foundations/-verso-data/NanumSquareNeo-Bold.woff2') format('woff2'); font-weight: 700; font-display: block; }
    @font-face { font-family: NanumSquareNeo; src: url('foundations/-verso-data/NanumSquareNeo-ExtraBold.woff2') format('woff2'); font-weight: 800; font-display: block; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #252525; background: #fafaf9; font-family: Pretendard, system-ui, sans-serif; line-height: 1.7; }
    main { max-width: 760px; margin: 14vh auto 0; padding: 0 28px 60px; }
    h1, h2 { font-family: NanumSquareNeo, Pretendard, system-ui, sans-serif; }
    h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -.025em; margin: 0 0 60px; }
    article { padding: 24px 0 30px; border-top: 1px solid #d6d6d3; border-bottom: 1px solid #d6d6d3; }
    h2 { margin: 0 0 12px; font-size: 24px; font-weight: 700; }
    a { color: #315b78; text-decoration-color: #b8ccd9; text-decoration-thickness: 1px; text-underline-offset: .23em; transition: color .15s, text-decoration-color .15s; }
    h2 a { color: #252f38; text-decoration: none; }
    a:hover { color: #193e58; text-decoration-color: currentColor; }
    h2 a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid #315b78; outline-offset: 4px; border-radius: 2px; }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    p { margin: 0; color: #575753; }
    ol { margin: 18px 0 0; padding-left: 24px; color: #575753; }
    footer { margin-top: 36px; font-size: 14px; color: #6b6b66; }
  </style>
</head>
<body>
  <main>
    <h1>Lean으로 배우는 수학</h1>
    <article>

      <ol>
        <li>Lean과 증명</li>
        <li>집합과 함수</li>
        <li>수와 동치관계</li>
        <li>집합의 크기</li>
      </ol>
    </article>
    <footer><a href="https://github.com/Cywohoy/lean-foundations">교재 소스</a> · <a href="https://github.com/Cywohoy/ample">Ample</a></footer>
  </main>
