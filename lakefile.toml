name = "lean-foundations"
defaultTargets = ["AlgebraBook", "textbook"]

[[require]]
name = "ample"
git = "https://github.com/Cywohoy/ample"
rev = "609f6e731c69aa73979ee4b151dd00c5a715bab1"

[[require]]
name = "MD4Lean"
path = "vendor/MD4Lean"

[[require]]
name = "subverso"
path = "vendor/subverso"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.35.0"

[[lean_lib]]
name = "AlgebraBook"
globs = ["AlgebraBook.*"]

[[lean_exe]]
name = "textbook"
root = "Main"
