<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="review-token" content="__REVIEW_TOKEN__">
  <title>교재 검토</title><link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header><a class="brand" href="#">교재 검토</a><span id="summary">상태를 불러오는 중</span>
    <button id="scan">변경 확인</button><button id="task-button">수정 작업</button></header>
  <p id="notice" role="status" hidden></p>
  <p id="protocol-notice" class="context-note" role="status" hidden></p>
  <div class="layout">
    <aside aria-label="검토 범위">
      <div class="search"><label for="search">범위 찾기</label><input id="search" type="search" placeholder="장·절·검토 대상"></div>
      <label class="filter" for="filter">표시 <select id="filter"><option value="all">전체</option><option value="dirty">재검토 필요</option><option value="unknown">검토 전</option></select></label>
      <nav id="tree" aria-label="검토 대상"></nav>
      <button class="add" id="add-unit">범위 추가</button>
    </aside>
    <main id="detail"><p>왼쪽에서 검토할 범위를 선택하세요.</p></main>
  </div>
  <dialog id="dialog"><form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close-dialog" aria-label="닫기">×</button></div><div id="dialog-body"></div><p id="form-error" role="alert" hidden></p><footer><button type="button" id="cancel-dialog">취소</button><button class="primary" type="submit" id="submit-dialog">저장</button></footer></form></dialog>
</body></html>
