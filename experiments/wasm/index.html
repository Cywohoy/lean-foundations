<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lean WASM compatibility experiment</title>
<link rel="icon" href="data:,">
<style>
body { max-width: 64rem; margin: 2rem auto; padding: 0 1rem; font: 17px/1.6 system-ui; }
h1 { font-size: 1.4rem; } textarea { box-sizing: border-box; width: 100%; height: 18rem; font: 16px/1.6 monospace; }
button { font: inherit; margin: .7rem .5rem .7rem 0; } pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<h1>Lean WASM compatibility experiment</h1>
<p id="runtime-note">Isolated browser runtime. The published textbook uses its own environment.</p>
<button id="start">Start Lean</button><button id="check" disabled>Check proof</button>
<span id="status">Not started</span>
<textarea id="source" spellcheck="false">theorem identity_proof (P : Prop) : P → P := by
  intro h
  exact h</textarea>
<pre id="goal-state" aria-live="polite"></pre>
<pre id="output" aria-live="polite"></pre>
<script type="module" src="client.js"></script>
<script>
if (new URLSearchParams(location.search).has('coi')) {
  // An updatefound event can arrive before installation/activation finishes.
  // Wait for activation before reloading the page that needs isolation.
  window.coi = {async doReload() {
    const registration = await navigator.serviceWorker.ready;
    const worker = registration.active;
    if (worker.state !== 'activated') await new Promise(resolve => {
      worker.addEventListener('statechange', () => {
        if (worker.state === 'activated') resolve();
      });
    });
    location.reload();
  }};
  const script = document.createElement('script');
  script.src = 'coi-serviceworker.js';
  document.head.append(script);
}
</script>
</html>
